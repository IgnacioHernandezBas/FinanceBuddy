services:
  db:
    image: pgvector/pgvector:pg17
    container_name: finance_buddy_db
    environment:
      POSTGRES_DB: finance_buddy
      POSTGRES_USER: finance_buddy
      POSTGRES_PASSWORD: finance_buddy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: finance_buddy_backend
    environment:
      DATABASE_URL: postgresql+psycopg://finance_buddy:finance_buddy@db:5432/finance_buddy
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      LANGSEARCH_API_KEY: ${LANGSEARCH_API_KEY}
      AGENT_WEB_SEARCH_API_KEY: ${AGENT_WEB_SEARCH_API_KEY}
      AGENT_WEB_SEARCH_PROVIDER: ${AGENT_WEB_SEARCH_PROVIDER:-langsearch}
      AGENT_WEB_ACCESS_MODE: ${AGENT_WEB_ACCESS_MODE:-allowed}
      AGENT_REQUIRE_WEB_SEARCH_CONSENT: ${AGENT_REQUIRE_WEB_SEARCH_CONSENT:-true}
      AGENT_WEB_SEARCH_MAX_RESULTS: ${AGENT_WEB_SEARCH_MAX_RESULTS:-5}
      AGENT_WEB_SEARCH_ALLOWED_DOMAINS: ${AGENT_WEB_SEARCH_ALLOWED_DOMAINS:-agenciatributaria.gob.es,cnmv.es,bde.es}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/src:/app/src
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    container_name: finance_buddy_frontend
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:8000

    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
