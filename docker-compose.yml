services:
  db:
    image: pgvector/pgvector:pg17
    container_name: finance_buddy_db
    environment:
      POSTGRES_DB: finance_buddy
      POSTGRES_USER: finance_buddy
      POSTGRES_PASSWORD: finance_buddy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: finance_buddy_backend
    environment:
      DATABASE_URL: postgresql+psycopg://finance_buddy:finance_buddy@db:5432/finance_buddy
    ports:
      - "8000:8000"
    volumes:
      - ./backend/src:/app/src
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    container_name: finance_buddy_frontend
    environment:
      VITE_API_BASE_URL: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
