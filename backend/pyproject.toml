[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.18.4",
    "cryptography>=46.0.6",
    "fastapi>=0.135.1",
    "google-genai>=1.70.0",
    "mlflow>=3.10.1",
    "pgvector>=0.4.2",
    "psycopg[binary]>=3.3.3",
    "pydantic-settings>=2.13.1",
    "pypdf>=6.9.2",
    "sentence-transformers>=5.3.0",
    "sqlalchemy>=2.0.48",
    "uvicorn[standard]>=0.42.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/finance_buddy_backend"]
